<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dayline Premium Checkout</title>
    <!-- 1. Load the official Cashfree JS SDK -->
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #FAF8F5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }
        .loader-container { text-align: center; color: #5B4294; }
        .spinner {
            border: 4px solid #EFEAF5; border-top: 4px solid #5B4294;
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 1s linear infinite; margin: 0 auto 16px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Loading UI while securing connection -->
    <div id="loader" class="loader-container">
        <div class="spinner"></div>
        <h3 style="margin:0;">Securing Connection...</h3>
        <p style="font-size:12px; color:#666677;">Powered by Cashfree</p>
    </div>

    <!-- Container where Cashfree will render the payment options -->
    <div id="payment-form"></div>

    <script>
        // Initialize Cashfree (Use "PROD" for live, "SANDBOX" for testing)
        const cashfree = Cashfree({ mode: "PROD" });

        // 1. Extract params sent from Sketchware URL
        const urlParams = new URLSearchParams(window.location.search);
        const uid = urlParams.get('uid');
        const plan = urlParams.get('plan');
        const price = urlParams.get('price');

        // 2. Fetch the Payment Session ID from your secure Vercel API
        async function initiatePayment() {
            try {
                const response = await fetch('/api/create-cashfree-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        uid: uid, 
                        plan: plan, 
                        amount: price 
                    })
                });
                
                const data = await response.json();

                if(data.payment_session_id) {
                    // Hide loader, trigger Cashfree UI
                    document.getElementById('loader').style.display = 'none';
                    
                    let checkoutOptions = {
                        paymentSessionId: data.payment_session_id,
                        redirectTarget: "_self", // Keeps it in the same Sketchware WebView
                        // The return url Cashfree triggers after payment
                        returnUrl: `https://dayline.nexify.in/payment-status?order_id={order_id}` 
                    };
                    
                    cashfree.checkout(checkoutOptions);
                } else {
                    alert("Failed to secure payment session.");
                }
            } catch (error) {
                console.error("Payment Init Error:", error);
                alert("Network error. Please close and try again.");
            }
        }

        // Start process immediately when page loads
        if(uid && price) {
            initiatePayment();
        } else {
            document.getElementById('loader').innerHTML = "<h3>Invalid Checkout Request</h3>";
        }
    </script>
</body>
</html>
