<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayline Checkout</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <style>
        :root {
            --primary: #5B4294;
            --bg-body: #fbfcff;
            --card-shadow: 0 10px 30px rgba(91, 66, 148, 0.08);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .checkout-box {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            max-width: 440px;
            width: 100%;
            text-align: center;
        }
        .badge {
            background: #f4f1fa;
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 15px;
        }
        .btn-pay {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="checkout-box">
        <div class="badge" id="codeBadge">Code Verified</div>
        <h2 style="margin: 0 0 10px 0;">Complete Your Upgrade</h2>
        <p style="color: #6b6b83; font-size: 14px; margin-bottom: 25px;">Select your plan and pay securely with Cashfree.</p>
        
        <div style="background: #fafafa; border: 1px solid #eee; border-radius: 10px; padding: 15px; text-align: left; margin-bottom: 20px;">
            <div style="font-size: 13px; color: #888;">Selected Code</div>
            <strong id="displayCode" style="font-size: 17px; color: var(--primary);">-</strong>
        </div>

        <button class="btn-pay" id="payBtn">Pay with Cashfree</button>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');

        if (!code) {
            window.location.href = '/premium';
        } else {
            document.getElementById('displayCode').textContent = code;
        }
    </script>
</body>
</html>
