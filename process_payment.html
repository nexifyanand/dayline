<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Processing Payment</title>
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <style>
        body {
            margin: 0; padding: 0; background-color: #F4F4F8;
            display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #1C1B33;
        }
        .spinner {
            border: 4px solid #EFEAF5; border-top: 4px solid #5B4294;
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .icon-box { font-size: 48px; margin-bottom: 16px; display: none; }
        h2 { margin: 0 0 8px 0; font-size: 18px; text-align: center; }
        p { margin: 0; color: #666677; font-size: 13px; text-align: center; padding: 0 20px; line-height: 1.5; }
        
        .success-text { color: #00C853; }
        .error-text { color: #D32F2F; }
    </style>
</head>
<body>
    <div class="spinner" id="loadingSpinner"></div>
    <div class="icon-box" id="statusIcon"></div>
    <h2 id="statusText">Securely Fetching Order...</h2>
    <p id="subText">Please do not close this window or press back.</p>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBOE4ivTCo_-Ap818kPjc6qXzNJ4f202Sk",
            databaseURL: "https://dayline-nexify-default-rtdb.firebaseio.com",
            projectId: "dayline-nexify"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const cashfree = Cashfree({ mode: "sandbox" }); 
        const CHECKOUT_API_URL = "/api/checkout"; 

        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('order_id');
        const isBounce = params.get('verify_bounce'); // Checks if returning from UPI

        function triggerRedirect(status, message) {
            document.getElementById('loadingSpinner').style.display = 'none';
            const icon = document.getElementById('statusIcon');
            const title = document.getElementById('statusText');
            const sub = document.getElementById('subText');
            
            icon.style.display = 'block';
            if (status === "SUCCESS") {
                icon.innerHTML = '✅';
                title.innerHTML = 'Payment Successful!';
                title.className = 'success-text';
                sub.innerText = "Redirecting to app...";
                setTimeout(() => { window.location.href = "/success"; }, 1500); 
            } else {
                icon.innerHTML = '❌';
                title.innerHTML = 'Payment Failed';
                title.className = 'error-text';
                sub.innerText = message + "\nReturning to checkout...";
                setTimeout(() => { window.location.href = "/failed"; }, 2500); 
            }
        }

        async function startPayment() {
            if (!orderId) {
                triggerRedirect("FAILED", "Invalid Request. Missing Order ID.");
                return;
            }

            // --- THE CRITICAL FIX: PREVENT DUPLICATE ORDER CREATION ---
            if (isBounce === "true") {
                try {
                    document.getElementById('statusText').innerText = "Finalizing Transaction...";
                    const dbRef = ref(db);
                    const orderSnap = await get(child(dbRef, `Pending_Orders/${orderId}`));
                    const orderData = orderSnap.val();

                    // Skip create_order and go STRAIGHT to finalize_payment
                    await fetch(CHECKOUT_API_URL, {
                        method: "POST", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            action: "finalize_payment",
                            orderId: orderId,
                            userId: orderData.uid,
                            planType: orderData.plan,
                            txType: orderData.paymentType || "New Purchase",
                            amountPaid: orderData.final_price,
                            paymentStatus: "VERIFY", // Tell backend to check with Cashfree
                            frontendRemarks: "Redirected from Gateway"
                        })
                    });
                    
                    triggerRedirect("SUCCESS", "Payment Verified");
                } catch(err) {
                    triggerRedirect("FAILED", err.message);
                }
                return; // Stop execution here so it doesn't run create_order below!
            }
            // -----------------------------------------------------------

            try {
                // NORMAL CHECKOUT START
                const dbRef = ref(db);
                const orderSnap = await get(child(dbRef, `Pending_Orders/${orderId}`));
                
                if (!orderSnap.exists()) {
                    throw new Error("Order details not found in database.");
                }
                
                const orderData = orderSnap.val();
                document.getElementById('statusText').innerText = "Initiating Gateway...";

                const response = await fetch(CHECKOUT_API_URL, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        action: "create_order",
                        orderId: orderId,
                        userId: orderData.uid, 
                        planAmount: orderData.base_price, 
                        finalAmount: orderData.final_price, 
                        discountAmount: orderData.discount_value || "0", 
                        planType: orderData.plan,
                        txType: orderData.paymentType || "New Purchase", 
                        couponCode: orderData.coupon_code || ""
                    })
                });

                const data = await response.json();
                if (data.status !== "success") throw new Error(data.message || "Failed to secure session");

                document.getElementById('statusText').innerText = "Awaiting Payment...";
                
                cashfree.checkout({
                    paymentSessionId: data.payment_session_id,
                    redirectTarget: "_self" // Required by Cashfree for UPI bounces
                }).then(async (result) => {
                    document.getElementById('statusText').innerText = "Verifying Transaction...";
                    
                    let remarks = "";
                    let finalStatus = "";

                    if (result.error) {
                        finalStatus = "FAILED";
                        remarks = result.error.message || "User cancelled or payment failed at gateway.";
                    } else if (result.paymentDetails) {
                        finalStatus = "SUCCESS";
                        remarks = "Payment processed successfully.";
                    }

                    await fetch(CHECKOUT_API_URL, {
                        method: "POST", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ 
                            action: "finalize_payment",
                            orderId: orderId,
                            userId: orderData.uid,
                            planType: orderData.plan,
                            txType: orderData.paymentType || "New Purchase",
                            amountPaid: orderData.final_price,
                            paymentStatus: finalStatus,
                            frontendRemarks: remarks
                        })
                    });

                    triggerRedirect(finalStatus, remarks);
                });

            } catch (error) {
                triggerRedirect("FAILED", error.message);
            }
        }

        startPayment();
    </script>
</body>
</html>
