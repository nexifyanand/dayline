<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Processing Payment</title>
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <style>
        body {
            margin: 0; padding: 0; background-color: #F4F4F8;
            display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #1C1B33;
        }
        .spinner {
            border: 4px solid #EFEAF5; border-top: 4px solid #5B4294;
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { margin: 0 0 8px 0; font-size: 18px; }
        p { margin: 0; color: #666677; font-size: 13px; text-align: center; padding: 0 20px;}
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h2 id="statusText">Initiating Secure Payment...</h2>
    <p>Please do not close this window or press back.</p>

   <script>
    const cashfree = Cashfree({ mode: "sandbox" }); 
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('order_id');

    async function startPayment() {
        if (!orderId) {
            document.getElementById('statusText').innerText = "Invalid Payment Request";
            return;
        }

        try {
            // 1. Initiate Order via backend
          // Inside process_payment.html
const response = await fetch(CHECKOUT_API_URL, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
        action: "create_order",
        userId: uid, 
        planAmount: planAmountFromUrl, // e.g., 589
        finalAmount: finalAmountFromUrl, // e.g., 569
        discountAmount: discountFromUrl, // e.g., 20
        planType: plan,
        txType: paymentTypeFromUrl, // "Top-up" or "New Purchase"
        couponCode: coupon
    })
});

            const data = await response.json();
            if (data.status !== "success") throw new Error(data.message);

            document.getElementById('statusText').innerText = "Awaiting Payment...";
            
            // 2. Launch Cashfree
            cashfree.checkout({
                paymentSessionId: data.payment_session_id,
                redirectTarget: "_modal"
            }).then(async (result) => {
                document.getElementById('statusText').innerText = "Verifying Transaction...";
                
                let remarks = "";
                let finalStatus = "";

                if (result.error) {
                    // Capture exact reason it failed or if user closed the modal
                    finalStatus = "FAILED";
                    remarks = result.error.message || "User cancelled or payment failed at gateway.";
                } else if (result.paymentDetails) {
                    // Capture success info
                    finalStatus = "SUCCESS";
                    remarks = result.paymentDetails.paymentMessage || "Payment processed successfully.";
                }

                // 3. Send Status AND Remarks to backend
                const verifyResponse = await fetch("/api/checkout/verify", {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        order_id: orderId,
                        cashfree_status: finalStatus,
                        payment_remarks: remarks
                    })
                });

                if (finalStatus === "FAILED") {
                    window.location.href = "/failed"; 
                } else {
                    window.location.href = "/success"; 
                }
            });

        } catch (error) {
            alert("Error initializing payment: " + error.message);
            window.location.href = "/failed";
        }
    }

    startPayment();
</script>
</body>
</html>
