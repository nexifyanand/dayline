<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Processing Payment</title>
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <style>
        body {
            margin: 0; padding: 0; background-color: #F4F4F8;
            display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #1C1B33;
        }
        .spinner {
            border: 4px solid #EFEAF5; border-top: 4px solid #5B4294;
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .icon-box { font-size: 48px; margin-bottom: 16px; display: none; }
        h2 { margin: 0 0 8px 0; font-size: 18px; text-align: center; }
        p { margin: 0; color: #666677; font-size: 13px; text-align: center; padding: 0 20px; line-height: 1.5; }
        
        .success-text { color: #00C853; }
        .error-text { color: #D32F2F; }
    </style>
</head>
<body>
    <div class="spinner" id="loadingSpinner"></div>
    <div class="icon-box" id="statusIcon"></div>
    <h2 id="statusText">Initiating Secure Payment...</h2>
    <p id="subText">Please do not close this window or press back.</p>

   <script>
    const cashfree = Cashfree({ mode: "sandbox" }); 
    const CHECKOUT_API_URL = "/api/checkout"; // Ensure this matches your Vercel route!

    // 1. EXTRACT ALL VARIABLES FROM URL (Fixes the undefined crash)
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('order_id') || "";
    const uid = params.get('uid') || "";
    const planAmountStr = params.get('planAmount') || "0";
    const finalAmountStr = params.get('finalAmount') || "0";
    const discountAmountStr = params.get('discountAmount') || "0";
    const planStr = params.get('plan') || "Unknown";
    const txTypeStr = params.get('txType') || "New Purchase";
    const couponStr = params.get('couponCode') || "";
    const daylineCodeStr = params.get('daylineCode') || "UNKNOWN_CODE";

    // Helper functions for UI (replaces freezing alerts)
    function triggerRedirect(status, message) {
        document.getElementById('loadingSpinner').style.display = 'none';
        const icon = document.getElementById('statusIcon');
        const title = document.getElementById('statusText');
        const sub = document.getElementById('subText');
        
        icon.style.display = 'block';
        if (status === "SUCCESS") {
            icon.innerHTML = '✅';
            title.innerHTML = 'Payment Successful!';
            title.className = 'success-text';
            sub.innerText = "Redirecting to app...";
            setTimeout(() => { window.location.href = "/success"; }, 1500);
        } else {
            icon.innerHTML = '❌';
            title.innerHTML = 'Payment Failed';
            title.className = 'error-text';
            sub.innerText = message + "\nReturning to checkout...";
            setTimeout(() => { window.location.href = "/failed"; }, 2000);
        }
    }

    async function startPayment() {
        if (!orderId || !uid) {
            triggerRedirect("FAILED", "Invalid Request. Missing ID.");
            return;
        }

        try {
            // 2. CREATE ORDER
            const response = await fetch(CHECKOUT_API_URL, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    action: "create_order",
                    orderId: orderId,
                    userId: uid, 
                    planAmount: planAmountStr, 
                    finalAmount: finalAmountStr, 
                    discountAmount: discountAmountStr, 
                    planType: planStr,
                    txType: txTypeStr, 
                    couponCode: couponStr,
                    daylineCode: daylineCodeStr
                })
            });

            const data = await response.json();
            if (data.status !== "success") throw new Error(data.message || "Failed to secure session");

            document.getElementById('statusText').innerText = "Awaiting Payment...";
            
            // 3. LAUNCH CASHFREE
            cashfree.checkout({
                paymentSessionId: data.payment_session_id,
                redirectTarget: "_modal"
            }).then(async (result) => {
                document.getElementById('statusText').innerText = "Verifying Transaction...";
                
                let remarks = "";
                let finalStatus = "";

                if (result.error) {
                    finalStatus = "FAILED";
                    remarks = result.error.message || "User cancelled or payment failed at gateway.";
                } else if (result.paymentDetails) {
                    finalStatus = "SUCCESS";
                    remarks = "Payment processed successfully.";
                }

                // 4. FINALIZE PAYMENT
                const verifyResponse = await fetch(CHECKOUT_API_URL, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        action: "finalize_payment",
                        orderId: orderId,
                        userId: uid,
                        planType: planStr,
                        txType: txTypeStr,
                        amountPaid: finalAmountStr,
                        paymentStatus: finalStatus,
                        frontendRemarks: remarks,
                        daylineCode: daylineCodeStr
                    })
                });

                const verifyData = await verifyResponse.json();

                // 5. REDIRECT BACK TO APP
                triggerRedirect(finalStatus, remarks);
            });

        } catch (error) {
            triggerRedirect("FAILED", error.message);
        }
    }

    startPayment();
</script>
</body>
</html>
