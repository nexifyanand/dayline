<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Dayline</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #F4F0FA; /* Dayline light background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #1A1A1A;
            text-align: center;
        }
        .container {
            background: #FFFFFF;
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(74, 59, 140, 0.08);
            width: 100%;
            max-width: 400px;
        }
        .error-code {
            color: #5E42A6; /* Dayline button purple */
            font-size: 80px;
            font-weight: 800;
            margin: 0;
            line-height: 1;

        }
        h2 {
            color: #3D2C8D; /* Dayline deep purple */
            margin-top: 16px;
            margin-bottom: 8px;
            font-size: 24px;
        }
        p {
            color: #7A7A9D;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 32px;
        }
        .btn-home {
            display: inline-block;
            background-color: #5E42A6;
            color: white;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 28px;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.2s;
            width: 100%;
            box-sizing: border-box;
        }
        .btn-home:hover {
            background-color: #3D2C8D;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 16px;
             color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon"></div>
        <h1 class="error-code">404</h1>
        <h2>Page Not Found</h2>
        <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        
        <!-- Change href="/" if your homepage is located elsewhere -->
        <a href="/" class="btn-home">Return to Homepage</a>
    </div>

</body>
</html>
