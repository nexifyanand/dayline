<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Verification - Dayline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
</head>
<body class="bg-[#F7F7FB] min-h-screen flex items-center justify-center font-sans text-[#2D2A36] p-4">

    <div class="bg-white max-w-md w-full rounded-2xl shadow-xl border border-[#E8E5EF] overflow-hidden text-center p-8">
        
        <div class="mb-8">
            <h1 class="text-3xl font-black tracking-tight text-[#5B4294]">DAYLINE</h1>
        </div>

        <div id="state-loading" class="space-y-4 block">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-[#5B4294]"></i>
            <h2 class="text-lg font-bold">Verifying your request...</h2>
            <p class="text-sm text-[#777481]">Please wait while we securely process your verification code.</p>
        </div>

        <div id="state-success" class="space-y-4 hidden">
            <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-2">
                <i class="fa-solid fa-check text-3xl"></i>
            </div>
            <h2 class="text-xl font-bold text-[#2D2A36]" id="success-title">Verification Complete!</h2>
            <p class="text-sm text-[#777481]" id="success-msg">Your email address has been successfully verified.</p>
            <button onclick="window.location.href='https://dayline.nexify.in'" class="mt-4 w-full bg-[#5B4294] hover:bg-[#493477] text-white font-bold py-3 rounded-xl transition-all shadow-md">
                Continue to Dayline
            </button>
        </div>

        <div id="state-error" class="space-y-4 hidden">
            <div class="w-16 h-16 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-2">
                <i class="fa-solid fa-xmark text-3xl"></i>
            </div>
            <h2 class="text-xl font-bold text-[#2D2A36]">Verification Failed</h2>
            <p class="text-sm text-rose-600 font-medium" id="error-msg">The link has expired or is invalid.</p>
        </div>
    </div>

    <script>
        function showState(state) {
            document.getElementById('state-loading').classList.add('hidden');
            document.getElementById('state-success').classList.add('hidden');
            document.getElementById('state-error').classList.add('hidden');
            document.getElementById('state-' + state).classList.remove('hidden');
        }

        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const reqId = urlParams.get('reqId');
            const token = urlParams.get('token');

            // If the URL doesn't have reqId or token, fail immediately
            if (!reqId || !token) {
                document.getElementById('error-msg').innerText = "Invalid verification link format.";
                showState('error');
                return;
            }

            // === IMPORTANT: REPLACE THIS URL WITH YOUR ACTUAL ADMIN PANEL BACKEND ===
            const ADMIN_API_URL = 'https://dayline-admin.vercel.app/api/admin.js'; 

            fetch(ADMIN_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    action: "verify_email_token", 
                    reqId: reqId, 
                    token: token 
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    document.getElementById('success-title').innerText = "Email Verified!";
                    document.getElementById('success-msg').innerText = "Your email address has been successfully verified and updated across all systems.";
                    showState('success');
                } else {
                    document.getElementById('error-msg').innerText = data.message || "Verification failed.";
                    showState('error');
                }
            })
            .catch(() => {
                document.getElementById('error-msg').innerText = "Network connection failed. Please try again.";
                showState('error');
            });
        });
    </script>
</body>
</html>
